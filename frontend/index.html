<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Mark Registry</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TITLE -->
  <h1>Student Registry</h1>
  <h3>admin</h3>

  <!-- ADD STUDENT -->
  <div class="section">
    <h2>Add Student</h2>

    <label>Name:</label>
    <input id="name" type="text" placeholder="Enter name">

    <label>Roll Number:</label>
    <input id="id" type="number" placeholder="Enter roll number">

    <label>Email:</label>
    <input id="email_id" type="text" placeholder="Enter email">

    <button onclick="create_students()">Add Student</button>

    <div id="message-add"></div>
  </div>

  <!-- LIST STUDENTS -->
  <div class="section">
    <h2>All Students</h2>

    <button onclick="load_students()">Load Students</button>

    <ul id="student-list"></ul>
  </div>

  <!-- UPDATE MARKS -->
  <div class="section">
    <h2>Update Marks</h2>

    <label>Roll Number:</label>
    <input id="student-id" type="number" placeholder="Enter student ID">

    <label>Subject:</label>
    <input id="subject" type="text" placeholder="Enter subject">

    <label>Marks:</label>
    <input id="marks" type="number" placeholder="Enter marks">

    <button onclick="add_or_update_mark()">Add / Update Marks</button>

    <div id="message-marks"></div>
  </div>

  <!-- DELETE STUDENT -->
  <div class="section">
    <h2>Delete Student</h2>

    <label>Roll Number:</label>
    <input id="delete-student-id" type="number" placeholder="Enter student ID">

    <button onclick="delete_student()">Delete</button>

    <div id="message-delete"></div>
  </div>

  <!-- JS -->
  <script src="script.js"></script>

</body>

</html>
