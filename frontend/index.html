<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="with=device-width, initial-scale=1.0">
  <title>Mark Registry</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- TITLE -->
  <h1>Student Registry</h1>
  <h3>Admin</h3>

  <!-- ADD STUDENT -->
  <div class="section">
    <h2>Add Student</h2>

    <!-- <label>Name:</label> -->
    <input id="name" type="text" placeholder="Name">

    <!-- <label>Roll Number:</label> -->
    <input id="id" type="number" placeholder="Roll Number">

    <!-- <label>Email:</label> -->
    <input id="email_id" type="text" placeholder="Email Id">

    <button onclick="create_students()">Add Student</button>

    <div id="message-add"></div>
  </div>

  <!-- LIST STUDENTS -->
  <div class="section">
    <h2>All Students</h2>
    <button onclick="load_students()">Load Students</button>
    <ul id="student-list"></ul>
  </div>

  <!-- UPDATE MARKS -->
  <div class="section">
    <h2>Update Marks</h2>

    <!-- <label>Roll Number:</label> -->
    <input id="student-id" type="number" placeholder="Roll Number">

    <!-- <label>Subject:</label> -->
    <input id="subject" type="text" placeholder="Subject">

    <!-- <label>Marks:</label> -->
    <input id="marks" type="number" placeholder="Marks">

    <button onclick="add_or_update_mark()">Add / Update Marks</button>

    <div id="message-marks"></div>
  </div>

  <!-- DELETE STUDENT -->
  <div class="section">
    <h2>Delete Student</h2>

    <!-- <label>Roll Number:</label> -->
    <input id="delete_student-id" type="number" placeholder="Roll Number">

    <button onclick="delete_student()">Delete</button>

    <div id="message-delete"></div>
  </div>

  <!-- DELETE SUBJECT -->
  <div class="section">
    <h2>Delete Subject</h2>
    <!-- <label>Roll Number:</label> -->
    <input id="delete-student-id" type="number" placeholder="Roll Number">

    <!-- <label>Subject:</label> -->
    <input id="delete-subject-name" type="text" placeholder="Subject">

    <button onclick="delete_subject()">Delete</button>

    <div id="message-box"></div>

  </div>

  <!-- JS -->
  <script src="script.js"></script>

</body>

</html>
